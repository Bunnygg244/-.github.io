<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ᶻᴴ's Profile Card</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            perspective: 1200px;
            overflow: hidden;
            font-family: sans-serif;
            position: relative;
        }

        /* Fullscreen Loading Screen */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
            transition: opacity 0.8s ease;
        }

        .loader-content {
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: pulse 1.5s infinite ease-in-out;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Main Wrapper Fade-In Effect */
        .main-wrapper {
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }

        .main-wrapper.visible {
            opacity: 1;
        }

        /* Background Audio Player (Hidden) */
        #audioPlayer {
            display: none;
        }

        /* Scene Wrapper for 3D card tilt */
        .scene {
            position: relative;
            width: 440px;
            height: 220px;
            transform-style: preserve-3d;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 3D Card Container (Pure Black Theme) */
        .card-container {
            position: absolute;
            width: 440px;
            height: 220px;
            background: #000000;
            border: 1px solid #111111;
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 1), 
                        0 0 20px rgba(0, 0, 0, 0.8),
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out, box-shadow 0.1s ease-out;
            cursor: grab;
            z-index: 10;
        }

        .card-container:active {
            cursor: grabbing;
        }

        /* Inner card content lifted in 3D space */
        .card-content {
            transform: translateZ(35px);
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .avatar {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #111111;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .header-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .name {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .bio {
            font-size: 13px;
            color: #ffffff;
            margin: 0;
            font-weight: 500;
        }

        .sub-bio {
            font-size: 11px;
            color: #ffffff;
            margin: 0;
        }

        .socials {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .social-icon {
            width: 26px;
            height: 26px;
            background: #000000;
            border: 1px solid #111111;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            text-decoration: none;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s;
        }

        .social-icon:hover {
            background: #111111;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        /* Smaller, non-3D static badge bar integrated directly into the card layout */
        .badge-bar-embedded {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            background: #000000;
            border: 1px solid #111111;
            border-radius: 20px;
            padding: 4px 8px;
            width: fit-content;
        }

        .badge-item {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
        }
    </style>
</head>

    <script>
        const card = document.getElementById('card');
        const audio = document.getElementById('audioPlayer');
        const loadingScreen = document.getElementById('loadingScreen');
        const mainWrapper = document.getElementById('mainWrapper');

        let rotX = 0;
        let rotY = 0;

        loadingScreen.addEventListener('click', () => {
            audio.play().catch(e => console.log("Audio play blocked", e));
            
            loadingScreen.style.opacity = '0';
            setTimeout(() => {
                loadingScreen.style.display = 'none';
                mainWrapper.classList.add('visible');
            }, 800);
        });

        document.addEventListener('mousemove', (e) => {
            const xCenter = window.innerWidth / 2;
            const yCenter = window.innerHeight / 2;

            rotY = ((e.clientX - xCenter) / xCenter) * 12;
            rotX = -((e.clientY - yCenter) / yCenter) * 12;

            card.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg) scale(1.02)`;
            card.style.boxShadow = `${-rotY * 1.2}px ${rotX * 1.2 + 25}px 50px rgba(0,0,0,1), 0 0 25px rgba(0, 0, 0, 1)`;
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateX(0deg) rotateY(0deg) scale(1)`;
            card.style.boxShadow = `0 25px 50px rgba(0,0,0,1), 0 0 20px rgba(0,0,0,1)`;
        });
    </script>
